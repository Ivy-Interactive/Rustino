[package]
name = "rustino_native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform native webview library powered by wry and tao"

[lib]
name = "rustino_native"
crate-type = ["cdylib"]

[dependencies]
tao = "0.33"
wry = "0.55"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.15"
notify-rust = "4"
muda = "0.17"
tray-icon = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
