[package]
name = "rustino_native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform native webview library powered by wry and tao"

[lib]
name = "rustino_native"
crate-type = ["cdylib"]

[dependencies]
tao = "0.33"
wry = "0.55"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.15"
notify-rust = "4"
