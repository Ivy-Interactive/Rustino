[package]
name = "rustino_native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform native webview library powered by wry and tao"

[lib]
name = "rustino_native"
crate-type = ["cdylib"]

[dependencies]
tao = "0.33"
wry = "0.55"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
rfd = "0.15"
notify-rust = "4"
muda = "0.17"
tray-icon = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]}

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
