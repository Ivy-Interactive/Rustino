# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directories:
      - "/src/Rustino.NET"
      - "/src/Rustino.NET.Reactive"
      - "/src/Rustino.Samples"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directories:
      - "/src/Rustino.Native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
